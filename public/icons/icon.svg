<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spCalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="spAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="spDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#spBgGrad)" stroke="#334155" stroke-width="2" filter="url(#spDropShadow)"/>
  
  <!-- Calendar Body -->
  <rect x="18" y="24" width="64" height="58" rx="12" fill="url(#spCalGrad)"/>
  
  <!-- Calendar Header Strip -->
  <path d="M18 34 A10 10 0 0 1 28 24 L72 24 A10 10 0 0 1 82 34 L82 40 L18 40 Z" fill="#1e40af"/>
  
  <!-- Rings -->
  <rect x="30" y="16" width="6" height="14" rx="3" fill="#f8fafc"/>
  <rect x="64" y="16" width="6" height="14" rx="3" fill="#f8fafc"/>
  
  <!-- "SP" Letters in Center of Calendar -->
  <text x="50" y="62" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SP</text>
  
  <!-- Small Calendar Grid Accents -->
  <circle cx="28" cy="72" r="2.5" fill="#93c5fd" opacity="0.9"/>
  <circle cx="38" cy="72" r="2.5" fill="#93c5fd" opacity="0.9"/>
  <circle cx="48" cy="72" r="2.5" fill="#93c5fd" opacity="0.9"/>
  
  <!-- Glowing Checkmark / Approval Badge -->
  <circle cx="74" cy="74" r="14" fill="url(#spAccentGrad)" stroke="#0f172a" stroke-width="3"/>
  <path d="M68 74 L72 78 L80 69" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
